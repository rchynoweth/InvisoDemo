id: fabric-survey
name: fabric-survey
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
      externalEntraExchange: true
    password:
      enabled: false
    allowedRedirectUris:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - https://eager-falls-3513564ab2-westus.webapp.fabricapps.net
      - http://localhost:5179
      - http://127.0.0.1:5179
      - https://fond-crane-f6c0057d1b-eastus2.webapp.fabricapps.net
  data:
    enabled: true
    path: packages/data
    buildCommand: npm run build
    dialect: mssql
  staticHosting:
    enabled: true
    path: packages/frontend
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
    embedded:
      only: false
  storage:
    enabled: false
  functions:
    enabled: true
    path: packages/functions
    buildCommand: npm run build
    auth:
      type: application
